{% extends "core/layout.html" %}

{# Cadre de l'espace administrateur : le cadre commun + les onglets d'administration. #}

{% block nav %}
{% with page=request.resolver_match.url_name %}
<a href="{% url 'backoffice:tableau_de_bord' %}" class="nav-item" {% if page == 'tableau_de_bord' %}aria-current="page"{% endif %}>
  <i aria-hidden="true" data-lucide="layout-dashboard" class="h-5 w-5"></i><span>Tableau de bord</span>
</a>
<a href="{% url 'backoffice:rendez_vous' %}" class="nav-item" {% if page == 'rendez_vous' or page == 'rendez_vous_detail' %}aria-current="page"{% endif %}>
  <i aria-hidden="true" data-lucide="calendar-check" class="h-5 w-5"></i><span>Rendez-vous</span>
</a>
<a href="{% url 'backoffice:file_attente' %}" class="nav-item" {% if page == 'file_attente' %}aria-current="page"{% endif %}>
  <i aria-hidden="true" data-lucide="hourglass" class="h-5 w-5"></i><span>File d'attente</span>
</a>
<a href="{% url 'backoffice:patients' %}" class="nav-item" {% if page == 'patients' or page == 'patient_detail' %}aria-current="page"{% endif %}>
  <i aria-hidden="true" data-lucide="users" class="h-5 w-5"></i><span>Patients</span>
</a>
<a href="{% url 'backoffice:parametres' %}" class="nav-item" {% if page == 'parametres' or page == 'symptomes' %}aria-current="page"{% endif %}>
  <i aria-hidden="true" data-lucide="sliders-horizontal" class="h-5 w-5"></i><span>Paramètres</span>
</a>
{% endwith %}
{% endblock %}
