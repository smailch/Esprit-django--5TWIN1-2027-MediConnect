{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230E7C86%27/%3E%3C/svg%3E">
  <title>{% block title %}MediConnect — Votre médecin, à portée de clic{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            primary: { DEFAULT: '#0E7C86', dark: '#0A5C64' },
            soft: '#EAF6F7',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/ui.css' %}">
  <link rel="stylesheet" href="{% static 'css/hero.css' %}">
</head>
<body class="font-sans font-light tracking-normal text-[#1F2937] bg-white antialiased">
  {% block content %}{% endblock %}

  <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
  {% block extra_js %}{% endblock %}
</body>
</html>
