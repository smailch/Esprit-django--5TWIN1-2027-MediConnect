# Toute l'application sur un poste, en conteneurs : site, worker Celery, Redis et MongoDB.
#   docker compose up --build        puis http://localhost:8000
#   docker compose exec web python manage.py charger_demo        (données de démonstration)
# La base est celle du conteneur « mongo », jamais le cluster Atlas de l'équipe. L'IA et l'e-mail sont facultatifs :
# leurs variables sont reprises du shell ou du fichier .env (IA_FOURNISSEUR, GROQ_API_KEY, EMAIL_*), sinon désactivés.
x-mediconnect: &mediconnect
  build: .
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *mediconnect
    environment:
      SERVICE: web
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_NAME: mediconnect
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cle-locale-docker-a-ne-jamais-utiliser-en-ligne}
      IA_FOURNISSEUR: ${IA_FOURNISSEUR:-aucun}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MediConnect <no-reply@mediconnect.local>}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante/')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *mediconnect
    environment:
      SERVICE: worker
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_NAME: mediconnect
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cle-locale-docker-a-ne-jamais-utiliser-en-ligne}
      IA_FOURNISSEUR: ${IA_FOURNISSEUR:-aucun}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MediConnect <no-reply@mediconnect.local>}

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-donnees:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

volumes:
  mongo-donnees:
